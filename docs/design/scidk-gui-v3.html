<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SciDK GUI v3.1 Wireframe</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#243347;background:#eef2f6}*{box-sizing:border-box}body{margin:0}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #ccd5e1;background:white;border-radius:7px;padding:8px 10px;color:#26374c}button:hover{background:#e8f0fa}button.primary{background:#245c8b;color:white;border-color:#245c8b}button.active{background:#dce9f6;border-color:#83a5ca}.shell{display:grid;grid-template-columns:190px 1fr;min-height:100vh}.side{background:#192d43;color:#f4f7fa;padding:18px 12px}.brand{font-size:22px;font-weight:700;padding:10px 12px 24px}.side button{display:block;width:100%;text-align:left;background:transparent;color:#d9e5f0;border:0;margin-bottom:5px}.side button.active{background:#33516f;color:white}.main{min-width:0}.top{height:64px;background:white;border-bottom:1px solid #dbe2eb;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.content{padding:24px;max-width:1480px;margin:auto}h1{font-size:26px;margin:0 0 7px}h2{font-size:17px;margin:0 0 12px}p{line-height:1.5}.muted{color:#617287}.small{font-size:12px}.panel{background:white;border:1px solid #dce4ed;border-radius:12px;padding:16px;min-width:0}.grid{display:grid;gap:14px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr) minmax(280px,0.85fr)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}.toolbar .push{margin-left:auto}.item{display:block;width:100%;text-align:left;padding:11px;border:1px solid #e3eaf2;border-radius:8px;margin:6px 0;background:#fff}.item.active{background:#eaf2fb;border-color:#8aadd0}.badge{font-size:11px;border:1px solid #cdd8e4;border-radius:14px;padding:3px 8px;color:#4a6078;white-space:nowrap}.field{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #edf1f5;font-size:13px}.field span:first-child{color:#5f7185}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button{font-size:13px}.canvas{background-color:#f6f9fc;background-image:radial-gradient(#cbd8e6 1px,transparent 1px);background-size:16px 16px;min-height:265px;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden}.node{border:1px solid #8aa8c7;background:#e0edf9;border-radius:8px;padding:14px 16px;font-size:13px;min-width:85px;text-align:center}.node.draft{background:#fff1d6;border-style:dashed;border-color:#c59d51}.arrow{padding:0 8px;color:#72879b}.metrics strong{font-size:28px;display:block;margin-bottom:4px}.chat{min-height:220px;display:flex;flex-direction:column;justify-content:space-between}.chat textarea{width:100%;min-height:72px;border:1px solid #d6e0eb;border-radius:8px;padding:10px}.inspector-expanded{grid-template-columns:1fr!important}.inspector-expanded .browse{display:none}.hidden{display:none!important}.notice{background:#f5f8fc;border:1px solid #e0e8f1;border-radius:8px;padding:12px;font-size:13px;color:#53677d}.footer{padding:20px 28px;color:#75869a;font-size:12px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:flex;overflow:auto;align-items:center;padding:8px}.brand{padding:8px;font-size:17px}.side button{white-space:nowrap;width:auto;margin:0}.content{padding:14px}.three,.two,.split{grid-template-columns:1fr}.top{padding:0 15px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">⬡ SciDK</div><div id="nav"></div></aside><main class="main"><header class="top"><strong id="crumb">Overview</strong><span class="badge">GUI v3.1 · Stage 6 aligned · synthetic data</span></header><div class="content" id="app"></div><div class="footer">SciDK GUI v3.1 · Stage 6 aligned · Design reference only · No live APIs, filesystem access, or database writes. Dataset-scoped DMS export is a required backend adapter; live Neo4j remains unverified.</div></main></div><script>
const pages=['Overview','Files & Datasets','Resources','Knowledge','Review','Settings'];let state={page:'Overview',fileTab:'Files',drive:'atwai',file:'Vevo_Study_01',dataset:'Vevo ultrasound study',inspect:true,expand:false,inspectTab:'Metadata',share:false,domain:'Research',view:'Graph',layout:'Split',selected:'Study',task:'Idle',resourceTab:'Sources',step:'Mapping',review:'PI–Lab affiliation',settings:'Plugins',chat:false,reviewChat:false};const el=document.getElementById('app');const B=(label,action,active=false,extra='')=>`<button class="${active?'active':''} ${extra}" onclick="${action}">${label}</button>`;const card=(x)=>`<div class="panel">${x}</div>`;const tabs=(items,key)=>`<div class="tabs">${items.map(x=>B(x,`set('${key}','${x}')`,state[key]===x)).join('')}</div>`;function set(k,v){state[k]=v;if(k==='fileTab'){state.expand=false;state.share=false}if(k==='domain'){state.selected='Study';state.task='Idle'}render()}function show(page){state.page=page;render()}function metadata(){let name=state.fileTab==='Files'?state.file:state.dataset;return `<div class="panel"><div class="toolbar"><strong>${name}</strong><span class="badge">Inspector</span><span class="push"></span>${B(state.expand?'Restore':'Expand',"set('expand',"+(!state.expand)+")")}${B('Close',"set('inspect',false)")}</div>${tabs(['Metadata','Annotations','Provenance'],'inspectTab')}${state.inspectTab==='Metadata'?`<h2>Filesystem metadata</h2>${[['Drive',state.drive],['Location','research/imaging'],['Record type',state.fileTab==='Files'?'File or folder':'Recognized dataset']].map(f=>`<div class="field"><span>${f[0]}</span><strong>${f[1]}</strong></div>`).join('')}<h2 style="margin-top:18px">Scientific metadata</h2>${[['Modality','Ultrasound'],['Instrument','Vevo (example)'],['Study association','Pending review'],['Evidence','Instrument metadata / intake']].map(f=>`<div class="field"><span>${f[0]}</span><strong>${f[1]}</strong></div>`).join('')}<p class="small muted">Implementation: expandable nested JSON/XML, raw source metadata, field-level citations and proposed corrections.</p>`:state.inspectTab==='Annotations'?`<h2>Annotations</h2><p>Reuse the existing SciDK annotations interface, editing and confirmation workflows.</p>`:`<h2>Provenance</h2><p>Resource · source version · extraction method · citations · epistemic status · curation decisions</p>`}${state.fileTab==='Datasets'?`<div class="toolbar">${B('Prepare for Sharing',"set('share',"+(!state.share)+")",false,'primary')}</div>${state.share?`<div class="notice"><strong>Sharing preparation</strong><p>NIH DMS Plan draft · Dataset manifest · FAIR check. Use the existing exporter; require investigator review.</p></div>`:''}`:''}<div class="toolbar">${B('View in Knowledge',"show('Knowledge')")}${B('Open Review',"show('Review')")}</div></div>`}
function files(){return `<h1>Files & Datasets</h1><p class="muted">Browse accessible drives, recognize datasets, inspect metadata and prepare to share.</p>${tabs(['Files','Datasets'],'fileTab')}<div class="toolbar">${state.fileTab==='Files'?B('+ Drive (admin)',"set('drive','research-share')"):B('Find source files',"set('fileTab','Files')")}${!state.inspect?B('Open metadata',"set('inspect',true)"):''}<span class="small muted">Drive discovery is an implementation requirement; no rclone commands run in this wireframe.</span></div><div class="grid ${state.expand?'inspector-expanded':'split'}"><div class="panel browse"><h2>${state.fileTab==='Files'?'Connected drives and browser':'Recognized datasets'}</h2>${state.fileTab==='Files'?`<div class="toolbar">${['atwai','lab-share','archive'].map(d=>B(d,`set('drive','${d}')`,state.drive===d)).join('')}</div><p class="small muted">${state.drive} / research / imaging</p>${['Vevo_Study_01','Imaging_2026','metadata.xml','acquisition.dat'].map(f=>`<button class="item ${state.file===f?'active':''}" onclick="set('file','${f}');set('inspect',true)">▣ ${f}</button>`).join('')}`:['Vevo ultrasound study','Microscopy collection','MicroCT acquisition'].map(d=>`<button class="item ${state.dataset===d?'active':''}" onclick="set('dataset','${d}');set('inspect',true)">▤ ${d}<br><span class="small muted">Scientific metadata and dataset membership</span></button>`).join('')}</div>${state.inspect?metadata():''}</div>`}
function overview(){return `<h1>Research at a glance</h1><p class="muted">Discover accepted, permitted institutional knowledge.</p><div class="grid three metrics">${[['64 TB','Indexed storage'],['4,080','Dataset candidates'],['—','Reviewed datasets']].map(x=>card(`<strong>${x[0]}</strong><span class="small muted">${x[1]}</span>`)).join('')}</div><div class="panel" style="margin-top:15px"><h2>Ask SciDK · Discovery assistant</h2><div class="chat"><p class="muted">Search datasets, projects, people, modalities and evidence. The production version uses authorized Parley/API tools.</p><div>${state.chat?'<div class="notice">Wireframe only: a real answer would cite authorized, currently supported graph facts.</div>':''}<textarea placeholder="Ask about your research data…"></textarea><div class="toolbar">${B('Ask',"set('chat',true)",false,'primary')}</div></div></div></div><div class="toolbar">${B('Browse Files',"show('Files & Datasets')")}${B('Explore Knowledge',"show('Knowledge')")}${B('Connect Sources',"show('Resources')")}</div>`}
function resources(){return `<h1>Resources</h1><p class="muted">Direct scientific sources and capability-based configuration.</p>${tabs(['Sources','Builder','Runs'],'resourceTab')}${state.resourceTab==='Sources'?`<div class="grid two">${['Work Orders CSV','SharePoint intake','PubMed / MeSH','NExtSEEK','TCGA / GDC','Pathways'].map(x=>card(`<strong>${x}</strong><p class="small muted">Source capabilities · schema · permissions · provenance</p>`)).join('')}</div>`:state.resourceTab==='Builder'?`${tabs(['Source','Schema','Mapping'],'step')}${card(`<h2>${state.step} builder</h2>${state.step==='Mapping'?'<div class="field"><span>PI Archived</span><strong>Person.name</strong></div><div class="field"><span>CACProtocol</span><strong>Project.identifier</strong></div><div class="field"><span>PI_OF</span><strong>Relationship</strong></div><p class="small muted">Reuse visual mapping roles and add JSON round-tripping, validation, preview and diffs.</p>':state.step==='Schema'?'<p>Reuse existing pipeline schema canvas, labels, roles and relationship definitions.</p>':'<p>Reuse existing plugin-template registry, connection settings and source validation.</p>'}`)}`:card('<h2>Runs and validation</h2><p>FAIR checks, schedules, mapping revisions, logs and import history.</p>')}`}
function knowledge(){let examples={Research:['Study','PI','Lab ?','Dataset'],Ontology:['Entity type','Predicate','Mapping ?','External term'],System:['Workflow','Tool','Docs ?','Permission']};let names=examples[state.domain];return `<h1>Knowledge workspace</h1><p class="muted">Explore, inspect and sketch connected knowledge.</p>${tabs(['Research','Ontology','System'],'domain')}<div class="toolbar">${tabs(['Graph','Entities','Sketch'],'view')}<span class="push"></span>${tabs(['Single','Split','3 panes'],'layout')}</div><div class="grid ${state.layout==='Single'?'':'split'}"><div class="panel"><div class="toolbar"><strong>${state.domain} ${state.view}</strong><span class="badge">${state.view==='Sketch'?'Private draft':'Read-only exploration'}</span></div>${state.view==='Entities'?names.map(n=>`<button class="item ${state.selected===n?'active':''}" onclick="set('selected','${n}')">${n}</button>`).join(''):`<div class="canvas"><div class="node">${names[0]}</div><span class="arrow">→</span><div class="node">${names[1]}</div><span class="arrow">→</span><div class="node draft">${names[2]}</div></div><p class="small muted">${state.view==='Graph'?'Reuse existing Cytoscape graph search, filtering, expansion, styling and saved maps.':'Draft nodes and edges may be incomplete or hypothetical until grounded and reviewed.'}</p>`}${state.view==='Sketch'?`<div class="toolbar">${B('Detect gaps',"set('task','Suggested')")}${B('Investigate',"set('task','Proposed')",false,'primary')}</div>`:''}</div>${state.layout!=='Single'?card(`<h2>Entity & evidence inspector</h2><p>Selected: <strong>${state.selected}</strong></p><p class="muted">Properties, relationships, citations, ontology grounding, current support and curation history.</p>${state.layout==='3 panes'?'<div class="notice">Additional reference pane: related docs, constraints or external ontology concepts.</div>':''}`):''}</div>${state.task!=='Idle'?`<div class="panel" style="margin-top:14px"><div class="toolbar"><h2>Enrichment task</h2><span class="badge">${state.task}</span></div><p>Bounded investigation for unresolved ${state.domain.toLowerCase()} knowledge. Agent returns evidence and proposed assertions only.</p>${B('Open in Review',"show('Review')",false,'primary')}</div>`:''}`}
function review(){return `<h1>Review</h1><p class="muted">Back-of-house: investigate, validate and decide with evidence.</p><div class="grid split"><div class="panel"><h2>Review queue</h2>${['PI–Lab affiliation','Ontology alignment','Dataset classification','System documentation'].map(r=>`<button class="item ${state.review===r?'active':''}" onclick="set('review','${r}')">${r}</button>`).join('')}</div>${card(`<h2>${state.review}</h2><span class="badge">Proposed</span><p>Evidence, source citation, epistemic status, ontology version and decision history.</p><div class="notice">Human approval is a separate, authenticated action. The wireframe cannot accept claims.</div>`)}</div><div class="panel" style="margin-top:14px"><h2>Review assistant · Investigate & propose</h2><p>Context follows: <strong>${state.review}</strong></p><p class="muted">Compare permitted evidence, explain uncertainty and draft assertions. No autonomous acceptance.</p>${state.reviewChat?'<div class="notice">Conceptual assistant response: compare cited evidence and recommend next checks.</div>':''}${B('Discuss this item',"set('reviewChat',true)")}</div>`}
function settings(){return `<h1>Settings</h1><p class="muted">Administration, plugin capabilities, providers and governance.</p>${tabs(['Plugins','AI','Security'],'settings')}${card(state.settings==='Plugins'?'<h2>Source plugins</h2><p>PubMed/MeSH · NExtSEEK · TCGA/GDC · Pathways · EDA</p><p class="small muted">Each source declares query, import, resolve, interpret, enrich or export capabilities.</p>':state.settings==='AI'?'<h2>AI providers</h2><p>Parley and approved endpoints · Overview/Review profiles · audit and usage</p>':'<h2>Disclosure and access</h2><p>Resource grants, classifications, provider approvals and fail-closed policy.</p>')}`}
function render(){document.getElementById('crumb').textContent=state.page;document.getElementById('nav').innerHTML=pages.map(p=>`<button class="${state.page===p?'active':''}" onclick="show('${p}')">${p}</button>`).join('');el.innerHTML=({Overview:overview,'Files & Datasets':files,Resources:resources,Knowledge:knowledge,Review:review,Settings:settings})[state.page]()}render();
</script></body></html>

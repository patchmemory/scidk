<!-- AI & Chat > LLM Provider Section: one OpenAI-compatible endpoint, per user (Parley Task 1) -->
<section id="ai-chat-llm-provider-section" class="settings-section">
  <h1>LLM Provider</h1>
  <p class="small">
    Your own connection to an OpenAI-compatible endpoint: MIT Parley, OpenAI, or a local Ollama.
    The key is yours: it's stored encrypted, only its last four characters are ever shown, and usage is billed to you.
  </p>

  <div class="row g-2" style="max-width:720px; margin-bottom:1rem">
    <div class="col-12 col-md-6">
      <label class="form-label small" for="llm-preset">Provider</label>
      <select id="llm-preset" class="form-select form-select-sm"></select>
      <small id="llm-preset-note" class="form-text text-muted"></small>
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label small" for="llm-base-url">Base URL</label>
      <input id="llm-base-url" type="url" class="form-control form-control-sm" placeholder="https://…/v1">
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label small" for="llm-api-key">API key</label>
      <input id="llm-api-key" type="password" class="form-control form-control-sm" autocomplete="off">
      <small id="llm-key-state" class="form-text text-muted"></small>
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label small" for="llm-model">Model</label>
      <div style="display:flex; gap:.5rem">
        <input id="llm-model" list="llm-model-list" class="form-control form-control-sm" placeholder="e.g. claude-sonnet-5-5">
        <button id="llm-load-models" class="btn btn-sm btn-outline-secondary" type="button" title="Load models from the endpoint">↻</button>
      </div>
      <datalist id="llm-model-list"></datalist>
    </div>
  </div>

  <div style="display:flex; gap:.5rem; align-items:center; flex-wrap:wrap">
    <button id="llm-save" class="btn btn-sm btn-primary" type="button">Save</button>
    <button id="llm-test" class="btn btn-sm btn-outline-secondary" type="button">Test connection</button>
    <button id="llm-clear-key" class="btn btn-sm btn-outline-danger" type="button">Remove key</button>
    <button id="llm-import-parley" class="btn btn-sm btn-outline-secondary" type="button" hidden
            title="Single-user installs only: reads the key from `parley env` on this machine">Import my key from <code>parley env</code></button>
    <span id="llm-status" class="small text-muted"></span>
  </div>
</section>

<script>
  function initLLMProvider() {
    const $ = id => document.getElementById(id);
    if (!$('llm-preset')) return;
    const API = (window.SCIDK_BASE || '') + '/api/llm';
    let presets = [];

    const status = (msg, cls) => { const s = $('llm-status'); s.textContent = msg; s.className = 'small ' + (cls ? 'text-' + cls : 'text-muted'); };
    const preset = () => presets.find(p => p.id === $('llm-preset').value) || {};
    const form = () => ({ preset: $('llm-preset').value, base_url: $('llm-base-url').value.trim(),
                          model: $('llm-model').value.trim(), api_key: $('llm-api-key').value.trim() || undefined });

    function showKeyState(s) {
      $('llm-key-state').textContent = s.key_unreadable ? 'A key is stored but can’t be decrypted (encryption key changed); enter it again.'
        : s.has_key ? `Stored: ${s.key_hint}. Leave blank to keep it.` : 'No key stored.';
      $('llm-clear-key').hidden = !s.has_key;
    }

    function applyPreset(fill) {
      const p = preset();
      $('llm-preset-note').textContent = p.note || '';
      $('llm-api-key').placeholder = p.key_placeholder || '';
      $('llm-import-parley').hidden = p.id !== 'parley';
      if (fill && p.base_url) $('llm-base-url').value = p.base_url;
    }

    async function loadModels() {
      const qs = new URLSearchParams({ base_url: $('llm-base-url').value.trim() });
      status('Loading models…');
      const r = await fetch(`${API}/models?${qs}`);
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { status(d.error || `Error ${r.status}`, 'danger'); return; }
      $('llm-model-list').innerHTML = d.models.map(m => `<option value="${m.replace(/"/g, '&quot;')}">`).join('');
      status(`${d.models.length} models available`, 'success');
    }

    async function save(extra) {
      const r = await fetch(`${API}/settings`, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
                                                 body: JSON.stringify({ ...form(), ...(extra || {}) }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { status(d.error || `Error ${r.status}`, 'danger'); return null; }
      $('llm-api-key').value = '';
      showKeyState(d);
      status('Saved', 'success');
      return d;
    }

    $('llm-preset').addEventListener('change', () => { applyPreset(true); if ($('llm-base-url').value) loadModels(); });
    $('llm-load-models').addEventListener('click', loadModels);
    $('llm-save').addEventListener('click', () => save());
    $('llm-clear-key').addEventListener('click', () => { if (confirm('Remove your stored API key?')) save({ clear_key: true, api_key: undefined }); });
    $('llm-test').addEventListener('click', async () => {
      status('Testing…');
      const r = await fetch(`${API}/test`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(form()) });
      const d = await r.json().catch(() => ({}));
      if (d.ok) status(`Connected: ${d.models} models` + (d.model ? `, ${d.model} answered` : '') + (d.cost ? ` (cost ${d.cost})` : ''), 'success');
      else status(d.error || `Error ${r.status}`, 'danger');
    });
    $('llm-import-parley').addEventListener('click', async () => {
      if (!confirm('Read your Parley key from `parley env` on this machine and store it encrypted?')) return;
      const r = await fetch(`${API}/import-parley-env`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                          body: JSON.stringify({ model: $('llm-model').value.trim() || undefined }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { status(d.error || `Error ${r.status}`, 'danger'); return; }
      $('llm-base-url').value = d.base_url; showKeyState(d); status('Imported from parley env', 'success'); loadModels();
    });

    (async () => {
      presets = (await (await fetch(`${API}/presets`)).json()).presets || [];
      $('llm-preset').innerHTML = presets.map(p => `<option value="${p.id}">${p.label}</option>`).join('');
      const s = await (await fetch(`${API}/settings`)).json();
      $('llm-preset').value = s.preset || 'parley';
      applyPreset(!s.base_url);
      if (s.base_url) $('llm-base-url').value = s.base_url;
      $('llm-model').value = s.model || '';
      showKeyState(s);
      if (s.configured) status(`Using ${s.model}`);
    })().catch(e => status('Could not load settings: ' + e.message, 'danger'));
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initLLMProvider);
  else initLLMProvider();
</script>

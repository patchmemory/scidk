{# The Resources local tabs: exactly Ecosystem, Sources, Plugins, Runs (`ws_view` = the active one). #}
<nav class="ws-tabs resources-tabs" aria-label="Resources views" data-testid="resources-tabs">
  {% for key, label in [('ecosystem', 'Ecosystem'), ('sources', 'Sources'), ('plugins', 'Plugins'), ('runs', 'Runs')] %}
  <a href="{{ request.script_root }}/resources?view={{ key }}" data-testid="resources-tab-{{ key }}"{% if ws_view == key %} aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>

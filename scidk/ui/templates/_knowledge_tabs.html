{# The Knowledge local tabs: exactly Entities, Relationships, Maps, Sketch (`view` = the active one, if any). #}
<nav class="ws-tabs knowledge-tabs" aria-label="Knowledge views" data-testid="knowledge-tabs">
  {% for key, label in [('entities', 'Entities'), ('relationships', 'Relationships'), ('maps', 'Maps'), ('sketch', 'Sketch')] %}
  <a href="{{ request.script_root }}/knowledge?view={{ key }}" data-testid="knowledge-tab-{{ key }}"{% if view == key %} aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>

profile_id: qupath_project
name: QuPath Digital Pathology Project
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
trigger:
  extensions: [".qpproj"]
  filename_pattern: ".*\\.qpproj$"
siblings:
  - group: annotations
    required: false
    type: file
    min_count: 1
    patterns:
      - ".*\\.qpdata$"
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: DigitalPathologyProject
    modality: WholeSlideImaging
    software: QuPath
    profile: qupath_project

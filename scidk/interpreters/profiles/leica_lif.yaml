profile_id: leica_lif
name: Leica Confocal Image File
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
trigger:
  extensions: [".lif"]
  filename_pattern: '^(?!\._).*\.lif$'
siblings:
  - group: external_data
    required: false
    type: dir
    min_count: 1
    patterns:
      - '^.*\.lifext$'
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: ConfocalMicroscopy
    modality: FluorescenceMicroscopy
    instrument: Leica SP8
    software: LAS X
    facility: TPSI
    profile: leica_lif

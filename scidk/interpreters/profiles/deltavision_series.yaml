profile_id: deltavision_series
name: DeltaVision Widefield Microscopy Series
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
trigger:
  extensions: [".dv"]
  filename_pattern: ".*\\.dv$"
siblings:
  - group: acquisition_log
    required: false
    type: file
    min_count: 1
    patterns:
      - ".*\\.log$"
      - ".*\\.dv\\.log$"
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: WideFieldMicroscopyDataset
    modality: Fluorescence
    instrument: DeltaVision
    profile: deltavision_series

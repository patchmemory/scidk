profile_id: star_alignment
name: STAR RNA-seq Alignment Output
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
trigger:
  extensions: [".out"]
  filename_pattern: '^.*Log\.final\.out$'
siblings:
  - group: splice_junctions
    required: true
    type: file
    min_count: 1
    patterns:
      - '^.*SJ\.out\.tab$'
  - group: genome
    required: false
    type: dir
    min_count: 1
    patterns:
      - '^.*_STARgenome$'
      - '^.*_STARpass1$'
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: RNAseqAlignment
    software: STAR
    profile: star_alignment

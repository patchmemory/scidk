profile_id: visium_spatial
name: 10X Genomics Visium Spatial Transcriptomics
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
trigger:
  extensions: [".h5"]
  filename_pattern: "^(filtered|raw)_feature_bc_matrix\\.h5$"
siblings:
  - group: spatial_data
    required: false
    type: file
    min_count: 1
    patterns:
      - ".*tissue_positions.*\\.csv$"
      - ".*scalefactors.*\\.json$"
      - ".*tissue_hires_image\\.png$"
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: SpatialTranscriptomics
    modality: Sequencing
    instrument: 10X Visium
    profile: visium_spatial

profile_id: tissuefax_slide
name: TissueFAXS Fluorescent Slide Scan
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
# TissueFAXS SL scans produce directories of .jxr (JPEG XR) tiles
# alongside XML metadata.
trigger:
  extensions: [".jxr"]
  filename_pattern: ".*\\.jxr$"
siblings:
  - group: scan_metadata
    required: false
    type: file
    min_count: 1
    patterns:
      - ".*\\.xml$"
      - ".*\\.ini$"
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: WholeSlideImaging
    modality: Fluorescence
    instrument: TissueFAXS
    profile: tissuefax_slide

profile_id: varian_mri
name: Varian/Agilent MRI Session (ParaVision)
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
trigger:
  extensions: [".xml"]
  filename_pattern: '^study\.xml$'
siblings:
  - group: parameters
    required: true
    type: file
    min_count: 1
    patterns:
      - '^studypar$'
  - group: session_files
    required: false
    type: file
    min_count: 1
    patterns:
      - '^enterSQ$'
      - '^plans$'
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: MRISession
    modality: MRI
    instrument: Varian 7T MRI (Bruker ParaVision)
    facility: PMIT
    profile: varian_mri

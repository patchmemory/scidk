profile_id: bruker_mri
name: Bruker MRI Acquisition
version: "1.0"
interpreter: bruker_mri_interpreter
inherits: file_collection
enabled: true
trigger:
  extensions: [".fid", ""]
  filename_pattern: "^(fid|acqp)$"
siblings:
  - group: parameters
    required: true
    type: file
    min_count: 2
    patterns:
      - "^acqp$"
      - "^method$"
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: MRIAcquisition
    modality: MRI
    instrument: Bruker
    profile: bruker_mri

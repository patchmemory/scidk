profile_id: nextflow_workflow
name: Nextflow Pipeline Run
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
trigger:
  extensions: [".log"]
  filename_pattern: '^\.?nextflow\.log$'
siblings:
  - group: workflow_markers
    required: false
    type: file
    min_count: 1
    patterns:
      - '^\.?nextflow\.log\.\d+$'
      - '^nf-test\.config$'
      - '^versions\.tsv$'
  - group: work_dir
    required: false
    type: dir
    min_count: 1
    patterns:
      - '^work$'
      - '^nextflow$'
      - '^\.nf-test$'
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: BioinformaticsPipelineRun
    software: Nextflow
    profile: nextflow_workflow

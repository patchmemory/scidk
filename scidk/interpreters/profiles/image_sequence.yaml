profile_id: image_sequence
name: Numbered Image Sequence
version: "1.0"
interpreter: null
inherits: tiff_collection
enabled: true
trigger:
  extensions: [".tif", ".tiff"]
  filename_pattern: ".*\\d{3,}\\.(tif|tiff)$"
siblings:
  - group: numbered_images
    required: true
    type: file
    min_count: 3
    patterns:
      - ".*\\d{3,}\\.(tif|tiff)$"
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: ImageSequence
    profile: image_sequence

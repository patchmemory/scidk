profile_id: ivis_spectrum
name: IVIS Spectrum Living Image Study
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
trigger:
  extensions: [".txt"]
  filename_pattern: '^SequenceInfo\.txt$'
siblings:
  - group: thumbnail
    required: true
    type: file
    min_count: 1
    patterns:
      - '^.*_SEQ\.PNG$'
      - '^.*_SEQ\.png$'
  - group: measurements
    required: false
    type: file
    min_count: 1
    patterns:
      - '^ClickInfo\.txt$'
      - '^AnalyzedClickInfo\.txt$'
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: BioluminescenceStudy
    modality: OpticalImaging
    instrument: IVIS Spectrum
    software: LivingImage
    facility: PMIT
    profile: ivis_spectrum

profile_id: operetta_hcs
name: PerkinElmer Operetta High-Content Screening
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
trigger:
  extensions: [".bfproj"]
  filename_pattern: '.*\.bfproj$'
siblings:
  - group: wells
    required: false
    type: dir
    min_count: 1
    patterns:
      - '^Slide.*$'
      - '^Well.*$'
      - '^Row.*$'
      - '^Z\d+$'
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: HighContentScreening
    modality: FluorescenceMicroscopy
    instrument: PerkinElmer Operetta CLS
    software: Harmony
    facility: TPSI
    profile: operetta_hcs

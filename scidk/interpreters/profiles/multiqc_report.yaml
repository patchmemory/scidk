profile_id: multiqc_report
name: MultiQC Aggregated QC Report
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
trigger:
  extensions: [".html"]
  filename_pattern: '^multiqc_report\.html$'
siblings:
  - group: data
    required: false
    type: dir
    min_count: 1
    patterns:
      - '^multiqc_data$'
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: QCReport
    software: MultiQC
    profile: multiqc_report

profile_id: canu_assembly
name: Canu Genome Assembly
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
trigger:
  extensions: [".report"]
  filename_pattern: '^.*\.report$'
siblings:
  - group: contigs
    required: true
    type: file
    min_count: 1
    patterns:
      - '^.*\.contigs\.fasta$'
      - '^.*\.contigs\.gfa$'
  - group: unitigs
    required: false
    type: file
    min_count: 1
    patterns:
      - '^.*\.unitigs\.fasta$'
      - '^.*\.unitigs\.gfa$'
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: GenomeAssembly
    software: Canu
    profile: canu_assembly

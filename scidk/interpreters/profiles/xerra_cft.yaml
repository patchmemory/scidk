profile_id: xerra_cft
name: Xerra Cryo-Fluorescence Tomography Study
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
trigger:
  extensions: [".json"]
  filename_pattern: '^study_detail_.*\.json$'
siblings:
  - group: slice_data
    required: true
    type: dir
    min_count: 1
    patterns:
      - '^slice_\d+$'
  - group: calibration
    required: false
    type: dir
    min_count: 1
    patterns:
      - '^calibration$'
  - group: reconstruction
    required: false
    type: dir
    min_count: 1
    patterns:
      - '^recon$'
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: CryoFluorescenceTomography
    modality: FluorescenceImaging
    instrument: Xerra CFT
    software: ImageJ
    facility: PMIT
    profile: xerra_cft

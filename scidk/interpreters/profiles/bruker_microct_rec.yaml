profile_id: bruker_microct_rec
name: Bruker Skyscan MicroCT Scan (reconstructed only)
version: "1.0"
interpreter: null
inherits: file_collection
enabled: true
trigger:
  extensions: [".tif"]
  filename_pattern: '.*_rec\d{8}\.tif$'
siblings:
  - group: rec_stack
    required: true
    type: file
    min_count: 5
    patterns:
      - '.*_rec\d+\.tif$'
  - group: preview
    required: false
    type: file
    min_count: 1
    patterns:
      - '.*_prev_\d+\.tif$'
graph:
  node_label: Dataset
  merge_on: [path, host]
  properties:
    type: MicroCTScan
    modality: MicroCT
    instrument: Bruker Skyscan 1276
    facility: PMIT
    processing_state: reconstructed
    profile: bruker_microct_rec
